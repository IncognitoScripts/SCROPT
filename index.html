<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolBook - Digital Learning Platform</title>
    <meta name="description" content="Modern digital schoolbook for students and teachers with real-time marks and notes system">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        .pulse-notification { animation: pulse 2s infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .scrollbar-thin { scrollbar-width: thin; scrollbar-color: #4b5563 #1f2937; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1f2937; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100">
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 fade-in">
        <div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full mx-4 slide-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white" id="authTitle">Login to SchoolBook</h2>
                <button id="closeAuth" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="authTabs" class="flex mb-6 border-b border-gray-700">
                <button id="loginTab" class="flex-1 py-2 font-medium text-green-400 border-b-2 border-green-400">Login</button>
                <button id="registerTab" class="flex-1 py-2 font-medium text-gray-400 hover:text-white">Register</button>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Student/Teacher ID</label>
                    <input type="text" id="loginId" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="Enter numeric ID" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="Enter password" required>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"><i class="fas fa-sign-in-alt mr-2"></i>Login</button>
            </form>
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Student/Teacher ID</label>
                    <input type="text" id="registerId" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="Enter numeric ID" pattern="[0-9]+" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                    <input type="text" id="registerName" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="Enter full name" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="registerPassword" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="Create a password" minlength="6" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Role</label>
                    <select id="registerRole" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"><i class="fas fa-user-plus mr-2"></i>Create Account</button>
            </form>
        </div>
    </div>
    <div id="notePopup" class="fixed inset-0 bg-green-900 bg-opacity-95 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-2xl p-8 max-w-lg w-full mx-4 border-2 border-green-500 slide-up">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center mr-3"><i class="fas fa-envelope text-white text-lg"></i></div>
                    <div>
                        <h2 class="text-xl font-bold text-white">New Message</h2>
                        <p class="text-green-300 text-sm" id="noteFrom"></p>
                    </div>
                </div>
                <button id="closeNote" class="text-gray-400 hover:text-white"><i class="fas fa-times text-2xl"></i></button>
            </div>
            <div class="bg-gray-700 rounded-xl p-6 mb-6">
                <p class="text-gray-100 text-lg" id="noteContent"></p>
                <p class="text-gray-400 text-sm mt-4" id="noteDate"></p>
            </div>
            <button id="markNoteRead" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"><i class="fas fa-check mr-2"></i>Mark as Read</button>
        </div>
    </div>
    <div id="app" class="min-h-screen hidden">
        <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
            <div class="container mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-green-600 rounded-xl flex items-center justify-center mr-3"><i class="fas fa-book text-white text-xl"></i></div>
                        <div>
                            <h1 class="text-xl font-bold text-white">SchoolBook</h1>
                            <p class="text-green-300 text-sm" id="userRoleBadge"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button id="notesButton" class="relative bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition duration-200">
                                <i class="fas fa-envelope mr-2"></i>Notes
                                <span id="unreadCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden"></span>
                            </button>
                        </div>
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mr-2"><span class="font-semibold" id="userInitials"></span></div>
                            <span class="text-white font-medium" id="userName"></span>
                        </div>
                        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition duration-200"><i class="fas fa-sign-out-alt mr-2"></i>Logout</button>
                    </div>
                </div>
            </div>
        </header>
                <main class="container mx-auto px-4 py-8">
            <div id="teacherDashboard" class="hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-white">Teacher Dashboard</h2>
                    <div class="flex space-x-4">
                        <button id="addMarkBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition duration-200"><i class="fas fa-plus mr-2"></i>Add Mark</button>
                        <button id="sendNoteBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition duration-200"><i class="fas fa-paper-plane mr-2"></i>Send Note</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-gray-800 rounded-2xl p-6">
                        <h3 class="text-xl font-bold text-white mb-4">Students</h3>
                        <div class="space-y-3 max-h-96 overflow-y-auto scrollbar-thin" id="studentsList"></div>
                    </div>
                    <div class="bg-gray-800 rounded-2xl p-6">
                        <h3 class="text-xl font-bold text-white mb-4">Recent Marks Given</h3>
                        <div class="space-y-3 max-h-96 overflow-y-auto scrollbar-thin" id="recentMarks"></div>
                    </div>
                </div>
            </div>
            <div id="studentDashboard" class="hidden">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-white">Student Dashboard</h2>
                    <p class="text-gray-400">Welcome back! Here's your academic overview.</p>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                    <div class="bg-gray-800 rounded-2xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400">Average Mark</p>
                                <p class="text-4xl font-bold text-white mt-2" id="averageMark">0.0</p>
                            </div>
                            <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center"><i class="fas fa-chart-line text-white text-2xl"></i></div>
                        </div>
                    </div>
                    <div class="bg-gray-800 rounded-2xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400">Total Marks</p>
                                <p class="text-4xl font-bold text-white mt-2" id="totalMarks">0</p>
                            </div>
                            <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center"><i class="fas fa-star text-white text-2xl"></i></div>
                        </div>
                    </div>
                    <div class="bg-gray-800 rounded-2xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400">Unread Notes</p>
                                <p class="text-4xl font-bold text-white mt-2" id="studentUnreadCount">0</p>
                            </div>
                            <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center"><i class="fas fa-envelope text-white text-2xl"></i></div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-800 rounded-2xl p-6 mb-8">
                    <h3 class="text-xl font-bold text-white mb-4">Your Marks</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-gray-700">
                                    <th class="text-left py-3 px-4 text-gray-400 font-medium">Subject</th>
                                    <th class="text-left py-3 px-4 text-gray-400 font-medium">Mark</th>
                                    <th class="text-left py-3 px-4 text-gray-400 font-medium">Date</th>
                                    <th class="text-left py-3 px-4 text-gray-400 font-medium">Teacher</th>
                                </tr>
                            </thead>
                            <tbody id="studentMarksTable"></tbody>
                        </table>
                    </div>
                </div>
                <div class="bg-gray-800 rounded-2xl p-6">
                    <h3 class="text-xl font-bold text-white mb-4">Your Notes</h3>
                    <div class="space-y-4 max-h-96 overflow-y-auto scrollbar-thin" id="studentNotesList"></div>
                </div>
            </div>
        </main>
    </div>
    <div id="addMarkModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full mx-4 slide-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Add New Mark</h2>
                <button id="closeMarkModal" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="addMarkForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Student</label>
                    <select id="markStudent" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" required></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Subject</label>
                    <input type="text" id="markSubject" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="e.g., Mathematics" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Mark (0-10)</label>
                    <input type="number" id="markValue" min="0" max="10" step="0.5" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" placeholder="8.5" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Comment</label>
                    <textarea id="markComment" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" rows="3" placeholder="Optional comment"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"><i class="fas fa-save mr-2"></i>Save Mark</button>
            </form>
        </div>
    </div>
    <div id="sendNoteModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full mx-4 slide-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Send Note</h2>
                <button id="closeNoteModal" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="sendNoteForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Recipient</label>
                    <select id="noteRecipient" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" required></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Message</label>
                    <textarea id="noteMessage" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-white" rows="4" placeholder="Type message..." required></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"><i class="fas fa-paper-plane mr-2"></i>Send Note</button>
            </form>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjqx9BvsCLo9z5lWGZo5eIOVRVJO8q3MU",
            authDomain: "marks-26ab0.firebaseapp.com",
            projectId: "marks-26ab0",
            storageBucket: "marks-26ab0.firebasestorage.app",
            messagingSenderId: "162106519149",
            appId: "1:162106519149:web:021000a9d3f691d73c5964",
            measurementId: "G-EZG9HQYBSJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appData = { currentUser: null, students: [], marks: [], notes: [], unreadNotes: [] };
                const elements = {
            authModal: document.getElementById('authModal'), app: document.getElementById('app'),
            loginForm: document.getElementById('loginForm'), registerForm: document.getElementById('registerForm'),
            loginTab: document.getElementById('loginTab'), registerTab: document.getElementById('registerTab'),
            authTitle: document.getElementById('authTitle'), closeAuth: document.getElementById('closeAuth'),
            logoutBtn: document.getElementById('logoutBtn'), loginId: document.getElementById('loginId'),
            loginPassword: document.getElementById('loginPassword'), registerId: document.getElementById('registerId'),
            registerName: document.getElementById('registerName'), registerPassword: document.getElementById('registerPassword'),
            registerRole: document.getElementById('registerRole'), teacherDashboard: document.getElementById('teacherDashboard'),
            studentDashboard: document.getElementById('studentDashboard'), userRoleBadge: document.getElementById('userRoleBadge'),
            userName: document.getElementById('userName'), userInitials: document.getElementById('userInitials'),
            studentsList: document.getElementById('studentsList'), recentMarks: document.getElementById('recentMarks'),
            averageMark: document.getElementById('averageMark'), totalMarks: document.getElementById('totalMarks'),
            studentUnreadCount: document.getElementById('studentUnreadCount'), studentMarksTable: document.getElementById('studentMarksTable'),
            studentNotesList: document.getElementById('studentNotesList'), addMarkBtn: document.getElementById('addMarkBtn'),
            sendNoteBtn: document.getElementById('sendNoteBtn'), notesButton: document.getElementById('notesButton'),
            unreadCount: document.getElementById('unreadCount'), addMarkModal: document.getElementById('addMarkModal'),
            sendNoteModal: document.getElementById('sendNoteModal'), addMarkForm: document.getElementById('addMarkForm'),
            sendNoteForm: document.getElementById('sendNoteForm'), closeMarkModal: document.getElementById('closeMarkModal'),
            closeNoteModal: document.getElementById('closeNoteModal'), markStudent: document.getElementById('markStudent'),
            markSubject: document.getElementById('markSubject'), markValue: document.getElementById('markValue'),
            markComment: document.getElementById('markComment'), noteRecipient: document.getElementById('noteRecipient'),
            noteMessage: document.getElementById('noteMessage'), notePopup: document.getElementById('notePopup'),
            closeNote: document.getElementById('closeNote'), markNoteRead: document.getElementById('markNoteRead'),
            noteContent: document.getElementById('noteContent'), noteFrom: document.getElementById('noteFrom'),
            noteDate: document.getElementById('noteDate')
        };

        function renderStudentsList(s) { return s.map(x => `<div class="flex items-center justify-between p-3 bg-gray-700 rounded-lg"><div class="flex items-center"><div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center mr-3"><span class="font-semibold">${x.name?x.name.charAt(0):'?'}</span></div><div><p class="font-medium text-white">${x.name}</p><p class="text-sm text-gray-400">ID: ${x.id}</p></div></div><span class="px-3 py-1 bg-gray-600 text-green-300 text-sm rounded-full">Student</span></div>`).join(''); }
        function renderRecentMarks(m) { return m.map(x => `<div class="flex items-center justify-between p-3 bg-gray-700 rounded-lg"><div><p class="font-medium text-white">${x.studentName}</p><p class="text-sm text-gray-400">${x.subject}</p></div><div class="text-right"><span class="inline-block px-3 py-1 ${getMarkColor(x.value)} text-white font-bold rounded-full">${x.value}</span><p class="text-xs text-gray-400 mt-1">${formatDate(x.date)}</p></div></div>`).join(''); }
        function renderStudentMarks(m) { if(m.length===0) return '<tr><td colspan="4" class="py-8 text-center text-gray-400">No marks yet</td></tr>'; return m.map(x => `<tr class="border-b border-gray-700"><td class="py-3 px-4 text-white">${x.subject}</td><td class="py-3 px-4"><span class="inline-block px-3 py-1 ${getMarkColor(x.value)} text-white font-bold rounded-full">${x.value}</span></td><td class="py-3 px-4 text-gray-300">${formatDate(x.date)}</td><td class="py-3 px-4 text-gray-300">${x.teacherName}</td></tr>`).join(''); }
        function renderStudentNotes(n) { if(n.length===0) return '<div class="text-center py-8 text-gray-400">No notes yet</div>'; return n.map(x => `<div class="p-4 bg-gray-700 rounded-lg ${x.read?'':'border-l-4 border-green-500'}"><div class="flex justify-between items-start mb-2"><div><p class="font-medium text-white">From: ${x.fromName}</p><p class="text-sm text-gray-400">${formatDate(x.date)}</p></div>${x.read?'':'<span class="px-2 py-1 bg-green-500 text-white text-xs rounded-full">New</span>'}</div><p class="text-gray-100">${x.message}</p></div>`).join(''); }
        function renderStudentDropdown(s) { return s.map(x => `<option value="${x.id}">${x.name} (ID: ${x.id})</option>`).join(''); }
        function getMarkColor(v) { if(v>=9) return 'bg-green-600'; if(v>=7) return 'bg-green-500'; if(v>=5) return 'bg-yellow-500'; return 'bg-red-500'; }
        function formatDate(t) { if(!t) return 'Just now'; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
        function getInitials(n) { if(!n) return '?'; return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
        function calculateAverage(m) { if(m.length===0) return '0.0'; const s = m.reduce((a,x)=>a+parseFloat(x.value),0); return (s/m.length).toFixed(1); }

        async function registerUser(id, name, password, role) {
            const ref = db.collection('users').doc(id);
            if ((await ref.get()).exists) throw new Error('User ID already exists');
            await ref.set({ id, name, role, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            return (await auth.createUserWithEmailAndPassword(`${id}@schoolbook.com`, password)).user;
        }
        async function loginUser(id, password) { return (await auth.signInWithEmailAndPassword(`${id}@schoolbook.com`, password)).user; }

        async function loadUserData(uid) {
            let doc = await db.collection('users').doc(uid).get();
            if(!doc.exists) return auth.signOut();
            appData.currentUser = { id: uid, ...doc.data() };
            if (appData.currentUser.role === 'teacher') {
                appData.students = (await db.collection('users').where('role', '==', 'student').get()).docs.map(d=>({id:d.id,...d.data()}));
            }
            let mq = appData.currentUser.role === 'teacher' ? db.collection('marks').where('teacherId', '==', uid) : db.collection('marks').where('studentId', '==', uid);
            let ms = await mq.get();
            appData.marks = await Promise.all(ms.docs.map(async d => {
                const data = d.data(); let sName = 'Unknown', tName = 'Unknown';
                const sDoc = await db.collection('users').doc(data.studentId).get(); if(sDoc.exists) sName = sDoc.data().name;
                const tDoc = await db.collection('users').doc(data.teacherId).get(); if(tDoc.exists) tName = tDoc.data().name;
                return { id: d.id, ...data, studentName: sName, teacherName: tName };
            }));
            appData.marks.sort((a,b)=> (b.date?(b.date.toDate?b.date.toDate():new Date(b.date)):0) - (a.date?(a.date.toDate?a.date.toDate():new Date(a.date)):0));

            let ns = await db.collection('notes').where('toId', '==', uid).get();
            appData.notes = await Promise.all(ns.docs.map(async d => {
                const data = d.data(); let fName = 'Unknown';
                const fDoc = await db.collection('users').doc(data.fromId).get(); if(fDoc.exists) fName = fDoc.data().name;
                return { id: d.id, ...data, fromName: fName };
            }));
            appData.notes.sort((a,b)=> (b.date?(b.date.toDate?b.date.toDate():new Date(b.date)):0) - (a.date?(a.date.toDate?a.date.toDate():new Date(a.date)):0));
            appData.unreadNotes = appData.notes.filter(x => !x.read);
            updateUI();
        }

        async function addMark(sid, sub, val, com) {
            await db.collection('marks').add({ studentId: sid, teacherId: appData.currentUser.id, subject: sub, value: parseFloat(val), comment: com, date: firebase.firestore.FieldValue.serverTimestamp() });
            showNotification('Mark added!', 'success'); await loadUserData(appData.currentUser.id); closeModal('addMarkModal'); elements.addMarkForm.reset();
        }
        async function sendNote(tid, msg) {
            await db.collection('notes').add({ fromId: appData.currentUser.id, toId: tid, message: msg, read: false, date: firebase.firestore.FieldValue.serverTimestamp() });
            showNotification('Note sent!', 'success'); await loadUserData(appData.currentUser.id); closeModal('sendNoteModal'); elements.sendNoteForm.reset();
        }

        function updateUI() {
            if(!appData.currentUser) return;
            elements.userName.textContent = appData.currentUser.name;
            elements.userInitials.textContent = getInitials(appData.currentUser.name);
            elements.userRoleBadge.textContent = appData.currentUser.role==='teacher'?'Teacher':'Student';
            if(appData.currentUser.role==='teacher') {
                elements.teacherDashboard.classList.remove('hidden'); elements.studentDashboard.classList.add('hidden');
                elements.studentsList.innerHTML = renderStudentsList(appData.students);
                elements.recentMarks.innerHTML = renderRecentMarks(appData.marks.slice(0,5));
                elements.markStudent.innerHTML = renderStudentDropdown(appData.students);
                elements.noteRecipient.innerHTML = renderStudentDropdown(appData.students);
            } else {
                elements.teacherDashboard.classList.add('hidden'); elements.studentDashboard.classList.remove('hidden');
                const sm = appData.marks.filter(x => x.studentId === appData.currentUser.id);
                elements.averageMark.textContent = calculateAverage(sm); elements.totalMarks.textContent = sm.length;
                elements.studentUnreadCount.textContent = appData.unreadNotes.length;
                elements.studentMarksTable.innerHTML = renderStudentMarks(sm);
                elements.studentNotesList.innerHTML = renderStudentNotes(appData.notes);
            }
            if(appData.unreadNotes.length > 0) {
                elements.unreadCount.textContent = appData.unreadNotes.length; elements.unreadCount.classList.remove('hidden');
                elements.notesButton.classList.add('pulse-notification'); showNotePopup(appData.unreadNotes[0]);
            } else { elements.unreadCount.classList.add('hidden'); elements.notesButton.classList.remove('pulse-notification'); }
        }

        function showNotePopup(n) { elements.noteContent.textContent = n.message; elements.noteFrom.textContent = `From: ${n.fromName}`; elements.noteDate.textContent = `Received: ${formatDate(n.date)}`; elements.notePopup.classList.remove('hidden'); elements.markNoteRead.dataset.noteId = n.id; }
        function closeModal(m) { document.getElementById(m).classList.add('hidden'); }
        function showModal(m) { document.getElementById(m).classList.remove('hidden'); }
        function showNotification(m, t='info') { const n = document.createElement('div'); n.className = `fixed top-4 right-4 px-6 py-3 rounded-lg z-50 ${t==='success'?'bg-green-600':'bg-red-600'}`; n.innerHTML = `<span>${m}</span>`; document.body.appendChild(n); setTimeout(()=>n.remove(),3000); }

        elements.loginTab.addEventListener('click', () => { elements.loginForm.classList.remove('hidden'); elements.registerForm.classList.add('hidden'); });
        elements.registerTab.addEventListener('click', () => { elements.loginForm.classList.add('hidden'); elements.registerForm.classList.remove('hidden'); });
        elements.closeAuth.addEventListener('click', () => closeModal('authModal'));
        elements.loginForm.addEventListener('submit', async e => { e.preventDefault(); try { await loginUser(elements.loginId.value.trim(), elements.loginPassword.value); } catch(err) { showNotification('Auth failed', 'error'); } });
        elements.registerForm.addEventListener('submit', async e => { e.preventDefault(); try { await registerUser(elements.registerId.value.trim(), elements.registerName.value.trim(), elements.registerPassword.value, elements.registerRole.value); } catch(err) { showNotification('Reg failed', 'error'); } });
        elements.logoutBtn.addEventListener('click', () => auth.signOut());
        elements.addMarkBtn.addEventListener('click', () => showModal('addMarkModal'));
        elements.sendNoteBtn.addEventListener('click', () => showModal('sendNoteModal'));
        elements.closeMarkModal.addEventListener('click', () => closeModal('addMarkModal'));
        elements.closeNoteModal.addEventListener('click', () => closeModal('sendNoteModal'));
        elements.addMarkForm.addEventListener('submit', e => { e.preventDefault(); addMark(elements.markStudent.value, elements.markSubject.value, elements.markValue.value, elements.markComment.value); });
        elements.sendNoteForm.addEventListener('submit', e => { e.preventDefault(); sendNote(elements.noteRecipient.value, elements.noteMessage.value); });
        elements.closeNote.addEventListener('click', () => closeModal('notePopup'));
        elements.markNoteRead.addEventListener('click', async () => { await db.collection('notes').doc(elements.markNoteRead.dataset.noteId).update({read:true}); await loadUserData(appData.currentUser.id); closeModal('notePopup'); });

        auth.onAuthStateChanged(user => { if(user) { loadUserData(user.email.split('@')[0]); } else { appData.currentUser = null; elements.app.classList.add('hidden'); showModal('authModal'); } });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolBook - Marks & Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-slideUp { animation: slideUp 0.5s ease-out forwards; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
        .animate-pulse-green { animation: pulse-green 2s infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .mark-circle {
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .mark-0, .mark-1 { background: #fecaca; color: #991b1b; }
        .mark-2, .mark-3 { background: #fed7aa; color: #9a3412; }
        .mark-4, .mark-5 { background: #fef08a; color: #854d0e; }
        .mark-6, .mark-7 { background: #bbf7d0; color: #166534; }
        .mark-8 { background: #86efac; color: #166534; }
        .mark-9, .mark-10 { background: #4ade80; color: #052e16; }

        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }
        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 3px solid #22c55e;
        }
        .notification-overlay {
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.6);
        }
        .toast { animation: slideUp 0.3s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e1b4b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 3px; }
        
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 min-h-screen text-white">

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>

    <!-- FULL SCREEN NOTE POPUP -->
    <div id="notePopup" class="hidden fixed inset-0 z-[90] notification-overlay flex items-center justify-center p-4">
        <div class="animate-scaleIn bg-gradient-to-br from-green-500 to-emerald-600 rounded-3xl shadow-2xl max-w-lg w-full p-8 text-white relative animate-pulse-green">
            <button onclick="dismissNotePopup()" class="absolute top-4 right-4 w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <i data-lucide="bell-ring" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-white/70 text-sm font-medium">New Mark Received</p>
                    <p id="popupTime" class="text-white/60 text-xs"></p>
                </div>
            </div>
            <div class="bg-white/15 rounded-2xl p-6 mb-4">
                <div class="flex items-center gap-4 mb-3">
                    <span class="text-white/70 text-sm">Mark:</span>
                    <span id="popupMark" class="text-4xl font-black font-display"></span>
                    <span class="text-white/50 text-lg">/ 10</span>
                </div>
                <div class="border-t border-white/20 pt-3">
                    <span class="text-white/70 text-sm">Note:</span>
                    <p id="popupNote" class="text-lg font-medium mt-1 leading-relaxed"></p>
                </div>
            </div>
            <p class="text-center text-white/50 text-sm">Press X to dismiss</p>
        </div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8 animate-slideUp">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl shadow-2xl shadow-indigo-500/30 mb-4 animate-float">
                    <i data-lucide="book-open" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-4xl font-black text-white font-display mb-2">SchoolBook</h1>
                <p class="text-slate-400">Marks & Notes for Students</p>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 animate-slideUp" style="animation-delay: 0.1s">
                <h2 class="text-2xl font-bold text-white mb-6">Sign In</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Student/Admin ID</label>
                        <div class="relative">
                            <i data-lucide="hash" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input id="loginId" type="text" placeholder="e.g. 618371793" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input id="loginPass" type="password" placeholder="Your password" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-xl transition-all hover:shadow-lg hover:shadow-indigo-500/25 active:scale-[0.98]">
                        Sign In
                    </button>
                </div>
                <p class="text-slate-500 text-center mt-5 text-sm">Don't have an account? <button onclick="showRegister()" class="text-indigo-400 hover:text-indigo-300 font-medium">Register</button></p>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="hidden bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8">
                <h2 class="text-2xl font-bold text-white mb-6">Create Account</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Full Name</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input id="regName" type="text" placeholder="Your full name" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Student ID (Any Number)</label>
                        <div class="relative">
                            <i data-lucide="hash" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input id="regId" type="text" placeholder="e.g. 618371793" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input id="regPass" type="password" placeholder="Choose a password" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <button onclick="handleRegister()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-semibold py-3 rounded-xl transition-all hover:shadow-lg hover:shadow-green-500/25 active:scale-[0.98]">
                        Create Account
                    </button>
                </div>
                <p class="text-slate-500 text-center mt-5 text-sm">Already have an account? <button onclick="showLogin()" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign In</button></p>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="adminDashboard" class="hidden min-h-screen">
        <div class="flex min-h-screen">
            
            <!-- Sidebar -->
            <aside class="hidden lg:flex w-64 bg-slate-900/80 backdrop-blur-xl border-r border-white/5 flex-col">
                <div class="p-6 border-b border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
                        </div>
                        <div>
                            <span class="text-white font-bold font-display block">SchoolBook</span>
                            <span id="sidebarUserName" class="text-xs text-indigo-400"></span>
                        </div>
                    </div>
                </div>
                
                <nav class="flex-1 p-4 space-y-1">
                    <!-- Admin Items -->
                    <button onclick="showView('students')" id="navStudents" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 text-sm font-medium">
                        <i data-lucide="users" class="w-5 h-5"></i> Students
                    </button>
                    <button onclick="showView('give')" id="navGive" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 text-sm font-medium">
                        <i data-lucide="pen-tool" class="w-5 h-5"></i> Give Mark & Note
                    </button>
                    <button onclick="showView('history')" id="navHistory" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 text-sm font-medium">
                        <i data-lucide="scroll-text" class="w-5 h-5"></i> All Notes History
                    </button>

                    <!-- Student Item -->
                    <button onclick="showView('my-notes')" id="navMyNotes" class="sidebar-item hidden w-full flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 text-sm font-medium">
                        <i data-lucide="book-marked" class="w-5 h-5"></i> My Notes
                    </button>
                </nav>

                <div class="p-4 border-t border-white/5">
                    <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 text-sm font-medium transition-all">
                        <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                    </button>
                </div>
            </aside>

            <!-- Main Workspace -->
            <div class="flex-1 flex flex-col">
                <!-- Mobile Header -->
                <header class="lg:hidden bg-slate-900/80 backdrop-blur-xl border-b border-white/5 p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
                        </div>
                        <span class="text-white font-bold font-display">SchoolBook</span>
                    </div>
                    <!-- Mobile Menu simplified to just Logout for demo purposes -->
                    <button onclick="handleLogout()" class="text-slate-400 hover:text-white transition-colors">
                        <i data-lucide="log-out" class="w-6 h-6"></i>
                    </button>
                </header>

                <!-- Content Area -->
                <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
                    
                    <!-- Admin: Students View -->
                    <div id="view-students" class="dashboard-view animate-fadeIn">
                        <h2 class="text-3xl font-display font-bold text-white mb-6">Registered Students</h2>
                        <div id="studentsList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            <!-- Dynamic Content -->
                        </div>
                    </div>

                    <!-- Admin: Give Mark View -->
                    <div id="view-give" class="dashboard-view hidden animate-fadeIn">
                        <h2 class="text-3xl font-display font-bold text-white mb-6">Give Mark & Note</h2>
                        <div class="max-w-2xl bg-white/5 border border-white/10 rounded-2xl p-6">
                            <div class="space-y-4">
                                <div>
                                    <label class="text-sm text-slate-400 mb-1 block">Select Student</label>
                                    <select id="studentSelect" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500 [&>option]:bg-slate-900">
                                        <!-- Dynamic Content -->
                                    </select>
                                </div>
                                <div>
                                    <label class="text-sm text-slate-400 mb-1 block">Mark (0-10)</label>
                                    <input id="markInput" type="number" min="0" max="10" placeholder="Enter mark" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="text-sm text-slate-400 mb-1 block">Note / Feedback</label>
                                    <textarea id="noteInput" rows="4" placeholder="Great job on..." class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <button onclick="submitNote()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 rounded-xl transition-all">Submit Evaluation</button>
                            </div>
                        </div>
                    </div>

                    <!-- Admin: All History View -->
                    <div id="view-history" class="dashboard-view hidden animate-fadeIn">
                        <h2 class="text-3xl font-display font-bold text-white mb-6">All Notes History</h2>
                        <div id="historyList" class="space-y-4">
                            <!-- Dynamic Content -->
                        </div>
                    </div>

                    <!-- Student: My Notes View -->
                    <div id="view-my-notes" class="dashboard-view hidden animate-fadeIn">
                        <h2 class="text-3xl font-display font-bold text-white mb-6">My Personal Notes</h2>
                        <div id="myNotesList" class="space-y-4">
                            <!-- Dynamic Content -->
                        </div>
                    </div>

                </main>
            </div>
        </div>
    </div>

    <script>
        // --- DATA INITIALIZATION ---
        // Setup default admin and storage on first load
        function initStorage() {
            let users = JSON.parse(localStorage.getItem('sb_users')) || [];
            // Create Admin if not exists
            if (!users.find(u => u.id === '666666')) {
                users.push({ id: '666666', name: 'Administrator', password: 'lukajiji', role: 'admin' });
                localStorage.setItem('sb_users', JSON.stringify(users));
            }
            if (!localStorage.getItem('sb_notes')) {
                localStorage.setItem('sb_notes', JSON.stringify([]));
            }
        }

        // --- HELPER FUNCTIONS ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const color = type === 'success' ? 'border-green-500 bg-green-500/10 text-green-400' : 'border-red-500 bg-red-500/10 text-red-400';
            toast.className = `toast px-4 py-3 rounded-xl border backdrop-blur-md font-medium shadow-lg flex items-center gap-2 ${color}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i> ${message}`;
            document.getElementById('toastContainer').appendChild(toast)
